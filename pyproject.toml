[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simplexity"
version = "0.1.0"
description = "Clean-room reproduction of 'Transformers Represent Belief State Geometry in their Residual Stream' (NeurIPS 2024)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "shiningshotgun"}
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
transformer-lens = [
    "transformer-lens>=1.14.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
simplexity = "simplexity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
