name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies (CPU-only torch wheel)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.0.2 scipy==1.13.1 matplotlib==3.9.4
      - name: Run test suite and pre-training gates
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify CLI gates runner
        run: |
          PYTHONPATH=src python -m simplexity.cli run-gates
